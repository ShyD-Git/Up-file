          #pragma mark Settings sheet UI

          - (UIView *)row:(NSString *)t control:(UIView *)ctrl {
              UILabel *l = MWLabel(t, 18, UIFontWeightRegular, MW_TEXT);
              [l setContentHuggingPriority:UILayoutPriorityDefaultLow forAxis:UILayoutConstraintAxisHorizontal];
              [ctrl setContentHuggingPriority:UILayoutPriorityRequired forAxis:UILayoutConstraintAxisHorizontal];
              UIStackView *h = [[UIStackView alloc] initWithArrangedSubviews:@[l, ctrl]];
              h.axis = UILayoutConstraintAxisHorizontal;
              h.alignment = UIStackViewAlignmentCenter;
              [h.heightAnchor constraintGreaterThanOrEqualToConstant:52].active = YES;
              return h;
          }

          - (UIView *)switchRow:(NSString *)t key:(NSString *)key def:(BOOL)d {
              UISwitch *sw = [UISwitch new];
              sw.onTintColor = MW_PURPLE;
              sw.on = MWBool(key, d);
              __weak UISwitch *wsw = sw;
              __weak MWManager *ws = self;
              [sw addAction:[UIAction actionWithHandler:^(UIAction *a) {
                  MWSetObj(key, @(wsw.isOn));
                  [ws settingChanged:key];
              }] forControlEvents:UIControlEventValueChanged];
              return [self row:t control:sw];
          }

          - (void)settingChanged:(NSString *)key {
              if ([key isEqualToString:kEnabled]) {
                  [self resetTracking];
              }
              if ([key isEqualToString:kAutoPiP] && self.pipController) {
                  self.pipController.canStartPictureInPictureAutomaticallyFromInline = MWBool(kAutoPiP, YES);
              }
          }

          static UIView *MWCard(NSArray<UIView *> *rows) {
              UIView *card = [UIView new];
              card.backgroundColor = MWRGB(255,255,255,0.55);
              card.layer.cornerRadius = 22;
              card.layer.borderWidth = 1;
              card.layer.borderColor = MWRGB(150,108,225,0.35).CGColor;
              UIStackView *s = [UIStackView new];
              s.axis = UILayoutConstraintAxisVertical;
              s.translatesAutoresizingMaskIntoConstraints = NO;
              [card addSubview:s];
              [NSLayoutConstraint activateConstraints:@[
                  [s.topAnchor constraintEqualToAnchor:card.topAnchor constant:4],
                  [s.bottomAnchor constraintEqualToAnchor:card.bottomAnchor constant:-4],
                  [s.leadingAnchor constraintEqualToAnchor:card.leadingAnchor constant:16],
                  [s.trailingAnchor constraintEqualToAnchor:card.trailingAnchor constant:-16]
              ]];
              for (NSUInteger i = 0; i < rows.count; i++) {
                  [s addArrangedSubview:rows[i]];
                  if (i + 1 < rows.count) {
                      UIView *ln = [UIView new];
                      ln.backgroundColor = MWRGB(150,108,225,0.22);
                      [ln.heightAnchor constraintEqualToConstant:1].active = YES;
                      [s addArrangedSubview:ln];
                  }
              }
              return card;
          }

          static UILabel *MWSection(NSString *t) {
              UILabel *l = [UILabel new];
              l.attributedText = [[NSAttributedString alloc] initWithString:t attributes:@{
                  NSFontAttributeName: [UIFont systemFontOfSize:15 weight:UIFontWeightBold],
                  NSForegroundColorAttributeName: MW_PURPLE,
                  NSKernAttributeName: @2.5
              }];
              return l;
          }

          - (UIButton *)button:(NSString *)t filled:(BOOL)f action:(void (^)(void))a {
              UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
              [b setTitle:t forState:UIControlStateNormal];
              b.titleLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightSemibold];
              b.layer.cornerRadius = 14;
              b.backgroundColor = f ? MW_PURPLE : MWRGB(150,108,225,0.18);
              [b setTitleColor:(f ? UIColor.whiteColor : MW_DEEP) forState:UIControlStateNormal];
              [b addAction:[UIAction actionWithHandler:^(UIAction *x) { a(); }] forControlEvents:UIControlEventTouchUpInside];
              [b.heightAnchor constraintEqualToConstant:46].active = YES;
              return b;
          }

          - (void)toggleSheet {
              if (self.sheet) [self hideSheet]; else [self showSheet];
          }

          - (void)showSheet {
              if (self.sheet) return;
              UIView *root = self.window.rootViewController.view;
              CGSize sz = self.window.bounds.size;

              self.dim = [[UIControl alloc] initWithFrame:root.bounds];
              self.dim.backgroundColor = MWRGB(0,0,0,0.25);
              [self.dim addTarget:self action:@selector(hideSheet) forControlEvents:UIControlEventTouchUpInside];
              [root insertSubview:self.dim belowSubview:self.floatBtn];

              CGFloat h = MIN(sz.height * 0.78, 640);
              self.sheet = [[UIView alloc] initWithFrame:CGRectMake(0, sz.height, sz.width, h)];
              self.sheet.layer.cornerRadius = 28;
              self.sheet.layer.maskedCorners = kCALayerMinXMinYCorner | kCALayerMaxXMinYCorner;
              self.sheet.layer.masksToBounds = YES;
              UIVisualEffectView *blur = [[UIVisualEffectView alloc] initWithEffect:[UIBlurEffect effectWithStyle:UIBlurEffectStyleSystemThinMaterialLight]];
              blur.frame = self.sheet.bounds;
              blur.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.sheet addSubview:blur];
              UIView *tint = [[UIView alloc] initWithFrame:self.sheet.bounds];
              tint.backgroundColor = MWRGB(243,238,250,0.65);
              tint.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.sheet addSubview:tint];

              UIView *grab = [[UIView alloc] initWithFrame:CGRectMake(sz.width / 2 - 28, 10, 56, 6)];
              grab.backgroundColor = MWRGB(150,108,225,0.5);
              grab.layer.cornerRadius = 3;
              [self.sheet addSubview:grab];

              UIScrollView *sv = [UIScrollView new];
              sv.translatesAutoresizingMaskIntoConstraints = NO;
              [self.sheet addSubview:sv];
              [NSLayoutConstraint activateConstraints:@[
                  [sv.topAnchor constraintEqualToAnchor:self.sheet.topAnchor constant:28],
                  [sv.leadingAnchor constraintEqualToAnchor:self.sheet.leadingAnchor],
                  [sv.trailingAnchor constraintEqualToAnchor:self.sheet.trailingAnchor],
                  [sv.bottomAnchor constraintEqualToAnchor:self.sheet.bottomAnchor]
              ]];

              UIStackView *st = [UIStackView new];
              st.axis = UILayoutConstraintAxisVertical;
              st.spacing = 12;
              st.translatesAutoresizingMaskIntoConstraints = NO;
              [sv addSubview:st];
              [NSLayoutConstraint activateConstraints:@[
                  [st.topAnchor constraintEqualToAnchor:sv.contentLayoutGuide.topAnchor constant:8],
                  [st.bottomAnchor constraintEqualToAnchor:sv.contentLayoutGuide.bottomAnchor constant:-40],
                  [st.leadingAnchor constraintEqualToAnchor:sv.contentLayoutGuide.leadingAnchor constant:16],
                  [st.trailingAnchor constraintEqualToAnchor:sv.contentLayoutGuide.trailingAnchor constant:-16],
                  [st.widthAnchor constraintEqualToAnchor:sv.frameLayoutGuide.widthAnchor constant:-32]
              ]];

              [st addArrangedSubview:MWSection(@"FEATURES")];
              [st addArrangedSubview:MWCard(@[
                  [self switchRow:@"Bật theo dõi" key:kEnabled def:NO],
                  [self switchRow:@"Rung khi có tin mới" key:kHaptic def:YES],
                  [self switchRow:@"Âm báo khi có tin mới" key:kSound def:NO],
                  [self switchRow:@"Tự bật PiP khi thoát app" key:kAutoPiP def:YES]
              ])];

              [st addArrangedSubview:MWSection(@"THEO DÕI")];
              UILabel *tl = MWLabel(@"Chu kỳ quét", 18, UIFontWeightRegular, MW_TEXT);
              self.intervalValue = MWLabel([NSString stringWithFormat:@"%.1fs", MWDouble(kInterval, 1.5)], 18, UIFontWeightSemibold, MW_PURPLE);
              UIStackView *top = [[UIStackView alloc] initWithArrangedSubviews:@[tl, self.intervalValue]];
              top.axis = UILayoutConstraintAxisHorizontal;
              UISlider *sl = [UISlider new];
              sl.minimumValue = 0.5;
              sl.maximumValue = 5.0;
              sl.value = (float)MWDouble(kInterval, 1.5);
              sl.minimumTrackTintColor = MW_PURPLE;
              __weak MWManager *ws = self;
              __weak UISlider *wsl = sl;
              [sl addAction:[UIAction actionWithHandler:^(UIAction *a) {
                  double v = round(wsl.value * 10) / 10.0;
                  MWSetObj(kInterval, @(v));
                  ws.intervalValue.text = [NSString stringWithFormat:@"%.1fs", v];
              }] forControlEvents:UIControlEventValueChanged];
              [sl addAction:[UIAction actionWithHandler:^(UIAction *a) {
                  [ws restartScanTimer];
              }] forControlEvents:UIControlEventTouchUpInside | UIControlEventTouchUpOutside];
              UIStackView *sr = [[UIStackView alloc] initWithArrangedSubviews:@[top, sl]];
              sr.axis = UILayoutConstraintAxisVertical;
              sr.spacing = 10;
              sr.layoutMarginsRelativeArrangement = YES;
              sr.layoutMargins = UIEdgeInsetsMake(12, 0, 12, 0);
              [st addArrangedSubview:MWCard(@[sr])];

              [st addArrangedSubview:[self button:@"Chọn vùng chat" filled:YES action:^{ [ws beginSelection]; }]];
              [st addArrangedSubview:[self button:@"Mở Cửa Sổ Nổi (PiP)" filled:YES action:^{ [ws startPiP]; }]];
              [st addArrangedSubview:[self button:@"Tắt PiP" filled:NO action:^{ [ws stopPiP]; }]];
              [st addArrangedSubview:[self button:@"Đặt lại bộ đếm tin mới" filled:NO action:^{ [ws resetTracking]; }]];

              [st addArrangedSubview:MWSection(@"TRẠNG THÁI")];
              self.statusLabel = MWLabel(@"", 14, UIFontWeightRegular, MW_TEXT);
              self.statusLabel.numberOfLines = 0;
              UIStackView *stRow = [[UIStackView alloc] initWithArrangedSubviews:@[self.statusLabel]];
              stRow.axis = UILayoutConstraintAxisVertical;
              stRow.layoutMarginsRelativeArrangement = YES;
              stRow.layoutMargins = UIEdgeInsetsMake(12, 0, 12, 0);
              [st addArrangedSubview:MWCard(@[stRow])];

              [root insertSubview:self.sheet belowSubview:self.floatBtn];
              [self refreshStatus];
              [UIView animateWithDuration:0.28 delay:0 options:UIViewAnimationOptionCurveEaseOut animations:^{
                  self.sheet.frame = CGRectMake(0, sz.height - h, sz.width, h);
              } completion:nil];
              self.uiTimer = [NSTimer scheduledTimerWithTimeInterval:0.5 repeats:YES block:^(NSTimer *t) {
                  [ws refreshStatus];
              }];
          }

          - (void)hideSheet {
              if (!self.sheet) return;
              [self.uiTimer invalidate];
              self.uiTimer = nil;
              UIView *s = self.sheet, *d = self.dim;
              self.sheet = nil;
              self.dim = nil;
              self.statusLabel = nil;
              CGSize sz = self.window.bounds.size;
              [UIView animateWithDuration:0.22 animations:^{
                  s.frame = CGRectMake(0, sz.height, sz.width, s.frame.size.height);
                  d.alpha = 0;
              } completion:^(BOOL f) {
                  [s removeFromSuperview];
                  [d removeFromSuperview];
              }];
          }

          - (void)refreshStatus {
              if (!self.statusLabel) return;
              CGRect r = MWRegion();
              NSString *reg = CGRectIsNull(r) ? @"chưa chọn" : [NSString stringWithFormat:@"đã chọn (%.0f%%, %.0f%%, %.0f%%, %.0f%%)", r.origin.x * 100, r.origin.y * 100, r.size.width * 100, r.size.height * 100];
              self.statusLabel.text = [NSString stringWithFormat:
                  @"Theo dõi: %@\nVùng chat: %@\nSố lần quét: %ld • Tin mới: %ld\nDòng chữ đọc được: %lu\nChụp ảnh: %@\nPiP: %@",
                  MWBool(kEnabled, NO) ? @"đang chạy" : @"tắt",
                  reg,
                  (long)self.scanCount, (long)self.newCount,
                  (unsigned long)self.latestLines.count,
                  self.captureInfo,
                  self.pipStatus];
          }

          #pragma mark Region selection

          - (void)beginSelection {
              [self hideSheet];
              self.floatBtn.hidden = YES;
              UIView *root = self.window.rootViewController.view;
              self.selView = [[MWSelectionView alloc] initWithFrame:root.bounds];
              __weak MWManager *ws = self;
              self.selView.onCancel = ^{
                  [ws endSelection];
              };
              self.selView.onDone = ^(CGRect n) {
                  MWSetRegion(n);
                  [ws resetTracking];
                  [ws endSelection];
              };
              [root addSubview:self.selView];
          }

          - (void)endSelection {
              [self.selView removeFromSuperview];
              self.selView = nil;
              self.floatBtn.hidden = NO;
          }

          @end

          __attribute__((constructor)) static void MWInit(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidBecomeActiveNotification object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *n) {
                      [[MWManager shared] setupIfPossible];
                  }];
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      [[MWManager shared] setupIfPossible];
                  });
              });
          }
          MW_EOF

      - name: Compile (arm64 + arm64e)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FW="-framework UIKit -framework Foundation -framework AVFoundation -framework AVKit -framework CoreMedia -framework CoreVideo -framework CoreGraphics -framework QuartzCore -framework Vision -framework AudioToolbox"
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc -O2 -dynamiclib \
            -install_name @executable_path/Frameworks/MuseWatch.dylib $FW MuseWatch.m -o MuseWatch_arm64.dylib
          OUT="MuseWatch_arm64.dylib"
          if clang -arch arm64e -isysroot "$SDK" -miphoneos-version-min=15.0 -fobjc-arc -O2 -dynamiclib \
            -install_name @executable_path/Frameworks/MuseWatch.dylib $FW MuseWatch.m -o MuseWatch_arm64e.dylib; then
            lipo -create MuseWatch_arm64.dylib MuseWatch_arm64e.dylib -output MuseWatch.dylib
          else
            echo "arm64e build failed, using arm64 only"
            cp MuseWatch_arm64.dylib MuseWatch.dylib
          fi
          codesign -f -s - MuseWatch.dylib
          lipo -info MuseWatch.dylib
          mkdir -p build
          cp MuseWatch.dylib build/MuseWatch.dylib
          ls -la build

      - name: Commit dylib
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build/MuseWatch.dylib
          git commit -m "build MuseWatch.dylib" || echo "nothing to commit"
          git pull --rebase || true
          git push

